<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tiptap Demo - Rich Text Editor</title>

  <!-- Cloudflare UI Design System -->
  <link rel="stylesheet" href="./assets/css/cloudflare-ui.css">
  <link rel="stylesheet" href="./assets/css/main.css">
  <link rel="stylesheet" href="./assets/css/demo.css">
</head>
<body>
  <div class="demo-container">
    <!-- Header -->
    <header class="demo-header">
      <div class="header-content">
        <h1>Tiptap Editor Demo</h1>
        <nav class="header-nav">
          <a href="./index.html" class="nav-link active">데모</a>
          <a href="./manual-kr.html" class="nav-link">매뉴얼</a>
          <a href="#examples" class="nav-link">예제</a>
        </nav>
      </div>
    </header>

    <!-- Main Content -->
    <main class="demo-main">
      <!-- Tab Navigation -->
      <div class="demo-tabs">
        <button class="tab-button active" data-tab="vanilla">Vanilla JavaScript</button>
        <button class="tab-button" data-tab="jquery">jQuery</button>
      </div>

      <!-- Vanilla JS Demo -->
      <div class="tab-content active" id="vanilla-tab">
        <div class="demo-layout">
          <div class="editor-section">
            <div class="toolbar" id="vanilla-toolbar"></div>
            <div class="editor-wrapper">
              <div id="vanilla-editor"></div>
            </div>
            <div class="editor-controls">
              <button class="btn btn-primary" id="vanilla-save">저장</button>
              <button class="btn btn-secondary" id="vanilla-load">불러오기</button>
              <button class="btn btn-ghost" id="vanilla-clear">초기화</button>
            </div>
          </div>

          <aside class="config-panel" id="vanilla-config">
            <h3>설정 패널</h3>
            <div class="config-content"></div>
          </aside>
        </div>
      </div>

      <!-- jQuery Demo -->
      <div class="tab-content" id="jquery-tab">
        <div class="demo-layout">
          <div class="editor-section">
            <div class="toolbar" id="jquery-toolbar"></div>
            <div class="editor-wrapper">
              <div id="jquery-editor"></div>
            </div>
            <div class="editor-controls">
              <button class="btn btn-primary" id="jquery-save">저장</button>
              <button class="btn btn-secondary" id="jquery-load">불러오기</button>
              <button class="btn btn-ghost" id="jquery-clear">초기화</button>
            </div>
          </div>

          <aside class="config-panel" id="jquery-config">
            <h3>설정 패널</h3>
            <div class="config-content"></div>
          </aside>
        </div>
      </div>

      <!-- Examples Section -->
      <section class="examples-section" id="examples">
        <h2>예제 모음</h2>
        <div class="examples-grid">
          <div class="example-card">
            <h3>Vanilla JavaScript</h3>
            <ul>
              <li><a href="./examples/vanilla/basic.html">기본 예제</a></li>
              <li><a href="./examples/vanilla/advanced.html">고급 예제</a></li>
              <li><a href="./examples/vanilla/plugins.html">플러그인 예제</a></li>
            </ul>
          </div>
          <div class="example-card">
            <h3>jQuery</h3>
            <ul>
              <li><a href="./examples/jquery/basic.html">기본 예제</a></li>
              <li><a href="./examples/jquery/advanced.html">고급 예제</a></li>
              <li><a href="./examples/jquery/ajax.html">AJAX 연동 예제</a></li>
            </ul>
          </div>
        </div>
      </section>
    </main>

    <!-- Footer -->
    <footer class="demo-footer">
      <p>&copy; 2025 Tiptap Editor Demo. Built with ❤️</p>
    </footer>
  </div>

  <!-- Storage Modal -->
  <div class="modal" id="storage-modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>저장된 문서</h3>
        <button class="modal-close">&times;</button>
      </div>
      <div class="modal-body">
        <div id="saved-items-list"></div>
      </div>
    </div>
  </div>

  <!-- jQuery for jQuery demo -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

  <!-- Tiptap via ES Module -->
  <script type="module">
    import { Editor } from 'https://esm.sh/@tiptap/core@3.7.2'
    import StarterKit from 'https://esm.sh/@tiptap/starter-kit@3.7.2'

    // Expose to window for demo scripts
    window.TiptapEditor = Editor
    window.TiptapStarterKit = StarterKit

    // Signal that Tiptap is loaded
    window.tiptapLoaded = true
    window.dispatchEvent(new CustomEvent('tiptap-loaded'))
  </script>

  <!-- Demo Scripts -->
  <script src="./assets/js/icons.js"></script>
  <script src="./assets/js/storage.js"></script>
  <script src="./assets/js/config-panel.js"></script>
  <script src="./assets/js/demo-vanilla.js"></script>
  <script src="./assets/js/demo-jquery.js"></script>

  <script>
    // Tab switching
    document.querySelectorAll('.tab-button').forEach(button => {
      button.addEventListener('click', () => {
        const tabId = button.dataset.tab

        // Update active states
        document.querySelectorAll('.tab-button').forEach(b => b.classList.remove('active'))
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'))

        button.classList.add('active')
        document.getElementById(`${tabId}-tab`).classList.add('active')
      })
    })
  </script>
</body>
</html>
